  <rect x="903" y="265" width="22" height="13" rx="3" fill="none" stroke="#e0efff" stroke-width="2"/><rect x="906" y="268" width="15" height="7" rx="1" fill="#a4e0d2"/>
  <text x="951" y="278" fill="#e0efff" font-size="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">09:41</text>
  <rect x="1008" y="252" width="35" height="39" rx="9" fill="url(#accent)"/>
  <use href="#grid" x="1016.5" y="262" color="#132a46"/>
  <path d="M1025 302v19q0 12-12 12H843" fill="none" stroke="#89b6ee" stroke-width="1.5" stroke-dasharray="4 5"/>
