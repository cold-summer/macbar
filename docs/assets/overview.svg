<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">MacBar — more room in your menu bar</title>
  <desc id="desc">Concept illustration of menu bar items organized into the top bar, a floating collection, and reversible hidden items. This is an illustration, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#172b48"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#8bd9fb"/><stop offset="1" stop-color="#8aabff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="210%"><feDropShadow dy="14" stdDeviation="16" flood-color="#050b18" flood-opacity=".35"/></filter>
    <g id="grid" fill="currentColor"><rect width="7" height="7" rx="2"/><rect x="11" width="7" height="7" rx="2"/><rect y="11" width="7" height="7" rx="2"/><rect x="11" y="11" width="7" height="7" rx="2"/></g>
  </defs>
  <rect width="1120" height="540" rx="24" fill="url(#bg)"/>
  <circle cx="1025" cy="446" r="230" fill="#6e9de8" opacity=".055"/>
  <text x="64" y="84" fill="#96b7db" font-size="13" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" letter-spacing="3">NATIVE MACOS MENU BAR MANAGER</text>
  <g transform="translate(66 120) scale(2.1)"><use href="#grid" color="#b1ddff"/></g>
  <text x="123" y="154" fill="#f2f7ff" font-size="48" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">MacBar</text>
  <text x="65" y="201" fill="#b3c7df" font-size="20" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">More room at the top. Everything within reach.</text>
  <rect x="64" y="245" width="992" height="53" rx="13" fill="#ffffff" fill-opacity=".10" stroke="#adcdf0" stroke-opacity=".18"/>
  <circle cx="88" cy="272" r="5" fill="#8bd9fb"/>
  <text x="107" y="278" fill="#dbe9fa" font-size="15" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Your workspace</text>
