  <text x="65" y="365" fill="#e7f1ff" font-size="19" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Keep. Collect. Hide.</text>
  <text x="65" y="393" fill="#9db5d0" font-size="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">Native icons, text and tray actions.</text>
