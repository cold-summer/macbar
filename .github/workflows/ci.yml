name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and universal build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run regression assertions
        run: ./scripts/test.sh
      - name: Build universal preview packages
        run: ./scripts/package.sh
      - name: Verify package checksum
        run: cd dist && shasum -a 256 -c *.sha256
      - name: Verify PKG payload
        run: pkgutil --payload-files dist/*.pkg | grep -Fx './MacBar.app/Contents/MacOS/MacBar'
      - name: Verify architectures and signature
        run: |
          lipo build/MacBar.app/Contents/MacOS/MacBar -verify_arch arm64 x86_64
          codesign --verify --strict build/MacBar.app
      - name: Verify application icon
        run: |
          icon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' build/MacBar.app/Contents/Info.plist)
          iconutil -c iconset "build/MacBar.app/Contents/Resources/$icon" -o build/MacBar.iconset
          test -s build/MacBar.iconset/icon_512x512@2x.png
      - name: Upload preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MacBar-universal-preview
          path: dist/*
          retention-days: 14
          if-no-files-found: error
