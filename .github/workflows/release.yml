name: Release preview

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish preview
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches application version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Run regression assertions
        run: ./scripts/test.sh
      - name: Build universal packages
        run: ./scripts/package.sh
      - name: Verify package and architectures
        run: |
          (cd dist && shasum -a 256 -c *.sha256)
          pkgutil --payload-files dist/*.pkg | grep -Fx './MacBar.app/Contents/MacOS/MacBar'
          lipo build/MacBar.app/Contents/MacOS/MacBar -verify_arch arm64 x86_64
          codesign --verify --strict build/MacBar.app
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          gh release create "$GITHUB_REF_NAME" \
            "dist/MacBar-$version-universal.pkg" \
            "dist/MacBar-$version-universal.pkg.sha256" \
            "dist/MacBar-$version-universal.zip" \
            "dist/MacBar-$version-universal.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MacBar $version Preview" \
            --notes-file .github/release-notes.md \
            --prerelease --latest=false --verify-tag
