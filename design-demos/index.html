<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MacBar · 浅色设计方向</title><style>
*{box-sizing:border-box}body{margin:0;background:#edeef0;color:#292c30;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e2e3e6;gap:16px}b{font-size:16px;letter-spacing:-.3px}nav{display:flex;gap:5px;padding:4px;background:#f2f3f5;border-radius:11px}button{border:0;background:transparent;border-radius:8px;padding:9px 17px;color:#61666d;font:inherit;cursor:pointer}button[aria-selected=true]{background:#fff;color:#20242a;box-shadow:0 1px 4px #00000012}button:focus-visible{outline:2px solid #41798a;outline-offset:2px}small{color:#7b8087;font-size:12px}iframe{display:block;width:100%;height:calc(100vh - 64px);border:0}@media(max-width:760px){header{padding:0 12px}header small{display:none}nav button{padding:8px 10px}header b{font-size:14px}}
</style></head><body><header><b>MacBar / 浅色方向</b><nav role="tablist" aria-label="设计方向"><button role="tab" aria-selected="true" data-page="a-warm-minimal.html">A · 奶白极简</button><button role="tab" aria-selected="false" data-page="b-native-air.html">B · 通透原生</button><button role="tab" aria-selected="false" data-page="c-light-workbench.html">C · 轻盈分栏</button></nav><small>概念稿 · 不影响本机设置</small></header><iframe title="设计方向交互预览" src="a-warm-minimal.html"></iframe><script>
for(const button of document.querySelectorAll('[role=tab]'))button.addEventListener('click',()=>{for(const tab of document.querySelectorAll('[role=tab]'))tab.setAttribute('aria-selected',String(tab===button));document.querySelector('iframe').src=button.dataset.page;});
</script></body></html>
